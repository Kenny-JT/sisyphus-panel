<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sisyphus Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129704;</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
  /* ============================================================
     Notion design tokens — light (default) & dark themes
     ============================================================ */
  :root {
    --bg: #ffffff;
    --bg-sidebar: #f7f7f5;
    --bg-modal: #ffffff;
    --fg: #37352f;
    /* text greys tuned to WCAG AA (4.5:1) on the sidebar, the page and the active row */
    --fg-mid: rgba(55, 53, 47, 0.8);
    --fg-dim: rgba(55, 53, 47, 0.72);
    --fg-faint: rgba(55, 53, 47, 0.35);   /* decoration only: separators, underlines */
    --fg-solid: #37352f;                   /* opaque, so emoji icons draw at full strength */
    --border: rgba(55, 53, 47, 0.09);
    --border-strong: rgba(55, 53, 47, 0.16);
    --hover: rgba(55, 53, 47, 0.06);
    --active: rgba(55, 53, 47, 0.08);
    --accent: #2383e2;
    --accent-soft: rgba(35, 131, 226, 0.12);
    --selection: rgba(35, 131, 226, 0.28);
    --red: #eb5757;
    --red-soft: rgba(235, 87, 87, 0.1);
    --red-text: #c42b2b;                   /* red for words: 4.5:1 on --red-soft too */
    --green: #0f7b6c;
    --yellow: #dfab01;
    --callout-bg: #f1f1ef;
    --code-bg: #f7f6f3;
    --code-border: rgba(55, 53, 47, 0.08);
    --inline-code-bg: rgba(135, 131, 120, 0.15);
    --inline-code-fg: #eb5757;
    --shadow-modal: rgba(15, 15, 15, 0.05) 0 0 0 1px, rgba(15, 15, 15, 0.1) 0 5px 10px, rgba(15, 15, 15, 0.2) 0 15px 40px;
    --shadow-menu: rgba(15, 15, 15, 0.05) 0 0 0 1px, rgba(15, 15, 15, 0.1) 0 3px 6px, rgba(15, 15, 15, 0.2) 0 9px 24px;
    --drag-bg: #ffffff;   /* sidebar row lifted by drag-to-reorder */
    --drag-shadow: 0 0 0 1px rgba(15, 15, 15, 0.06), 0 2px 3px rgba(15, 15, 15, 0.08), 0 6px 10px -4px rgba(15, 15, 15, 0.2);
    --scrollbar: rgba(55, 53, 47, 0.3);
    --scrollbar-hover: rgba(55, 53, 47, 0.45);
    /* Prism token palette (GitHub-light-ish, reads well on Notion gray) */
    --tok-comment: #6e7781;
    --tok-keyword: #cf222e;
    --tok-string: #0a3069;
    --tok-function: #8250df;
    --tok-number: #0550ae;
    --tok-class: #953800;
    --tok-operator: #cf222e;
    --tok-punct: #57606a;
    --tok-variable: #24292f;
  }
  html[data-theme="dark"] {
    --bg: #191919;
    --bg-sidebar: #202020;
    --bg-modal: #252525;
    --fg: rgba(255, 255, 255, 0.81);
    --fg-mid: rgba(255, 255, 255, 0.62);
    --fg-dim: rgba(255, 255, 255, 0.52);
    --fg-faint: rgba(255, 255, 255, 0.28);
    --fg-solid: #d4d4d4;
    --border: rgba(255, 255, 255, 0.094);
    --border-strong: rgba(255, 255, 255, 0.16);
    --hover: rgba(255, 255, 255, 0.055);
    --active: rgba(255, 255, 255, 0.08);
    --accent: #2383e2;
    --accent-soft: rgba(35, 131, 226, 0.2);
    --selection: rgba(35, 131, 226, 0.35);
    --red: #eb5757;
    --red-soft: rgba(235, 87, 87, 0.15);
    --red-text: #ff7b72;
    --green: #4dab9a;
    --yellow: #ffdc49;
    --callout-bg: #252525;
    --code-bg: #202020;
    --code-border: rgba(255, 255, 255, 0.094);
    --inline-code-bg: rgba(135, 131, 120, 0.25);
    --inline-code-fg: #ff8b8b;
    --shadow-modal: rgba(0, 0, 0, 0.2) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 5px 10px, rgba(0, 0, 0, 0.5) 0 15px 40px;
    --shadow-menu: rgba(0, 0, 0, 0.2) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 3px 6px, rgba(0, 0, 0, 0.5) 0 9px 24px;
    --drag-bg: #373737;   /* lighter than the sidebar and the active row, so it reads as lifted */
    --drag-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 2px 3px rgba(0, 0, 0, 0.35), 0 6px 10px -4px rgba(0, 0, 0, 0.6);
    --scrollbar: rgba(255, 255, 255, 0.28);
    --scrollbar-hover: rgba(255, 255, 255, 0.42);
    /* Prism token palette (GitHub-dark-ish) */
    --tok-comment: #8b949e;
    --tok-keyword: #ff7b72;
    --tok-string: #a5d6ff;
    --tok-function: #d2a8ff;
    --tok-number: #79c0ff;
    --tok-class: #ffa657;
    --tok-operator: #ff7b72;
    --tok-punct: #c9d1d9;
    --tok-variable: #e6edf3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                 "PingFang SC", "Microsoft YaHei", "Apple Color Emoji", Arial, sans-serif,
                 "Segoe UI Emoji", "Segoe UI Symbol";
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }
  ::selection { background: var(--selection); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); background-clip: content-box; }
  button { font-family: inherit; }

  /* ============================================================
     App shell: sidebar | main
     ============================================================ */
  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: 250px;
    min-width: 250px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease, visibility 0s;
    overflow: hidden;
  }
  /* closed, it is also hidden (once it has slid out), so nothing in it can be
     tabbed to or keep the keyboard focus */
  .app[data-sidebar="closed"] .sidebar { margin-left: -250px; visibility: hidden; transition: margin-left 0.2s ease, visibility 0s 0.2s; }

  .ws-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9.5px 6px 12.5px 14px;   /* centred on the top bar's 45px row, like the breadcrumb */
    user-select: none;
  }
  .ws-emoji { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; color: var(--fg-solid); }
  .ws-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--fg-dim);
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--fg-mid); }

  .sb-search {
    margin: 2px 6px 8px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px 5px 7px;   /* + 1px border: the icon box starts where the rows' does */
    border-radius: 6px;
    background: var(--hover);
    border: 1px solid transparent;
    transition: border-color 0.1s ease, background 0.1s ease;
  }
  .sb-search:focus-within { border-color: var(--accent); background: var(--bg); }
  .sb-search .mag { width: 20px; display: inline-flex; justify-content: center; flex-shrink: 0; color: var(--fg-dim); }
  .sb-search input {
    flex: 1;
    min-width: 0;
    padding: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
  }
  .sb-search input::placeholder { color: var(--fg-dim); }

  .sb-label {
    position: relative;
    padding: 6px 14px 2px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--fg-dim);
    user-select: none;
  }

  /* "Sort by newest": only while a manual order is saved, shown on sidebar hover */
  .sb-label-btn {
    position: absolute;
    top: 5px;
    right: 8px;
    padding: 1px 6px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--fg-dim);
    font: inherit;
    font-weight: 500;
    letter-spacing: normal;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.1s ease, background 0.1s ease, color 0.1s ease;
  }
  .sidebar:hover .sb-label-btn, .sb-label-btn:focus-visible { opacity: 1; }
  .sb-label-btn:hover { background: var(--hover); color: var(--fg-mid); }

  .sb-pages {
    flex: 1;
    overflow-y: auto;
    /* the scrollbar's 6px gutter is always reserved, so the dates don't jump
       sideways once the list starts to scroll */
    scrollbar-gutter: stable;
    padding: 2px 0 8px 6px;
    /* rows sliding under the top/bottom edge fade out, only while there is
       more to scroll to (more-above / more-below come from syncListFades) */
    --fade-top: 0px;
    --fade-bottom: 0px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
  }
  .sb-pages.more-above { --fade-top: 32px; }
  .sb-pages.more-below { --fade-bottom: 48px; }
  .sb-pages.sorting { -webkit-mask-image: none; mask-image: none; }   /* the lifted row would fade too */
  .sb-pages::-webkit-scrollbar { width: 6px; }
  .sb-pages::-webkit-scrollbar-thumb { border-width: 1px; }
  .sb-item {
    display: flex;
    align-items: baseline;   /* title and date share a baseline; icon, dot and ✕ centre themselves */
    gap: 7px;
    padding: 5px 8px;
    margin: 1px 0;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    color: var(--fg-mid);
    transition: background 0.1s ease;
    position: relative;
  }
  .sb-item:hover { background: var(--hover); }
  .sb-item.active { background: var(--active); color: var(--fg); font-weight: 500; }
  .sb-item-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; align-self: center; color: var(--fg-solid); }
  .sb-item-title {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sb-item-time {
    font-size: 10.5px;
    color: var(--fg-dim);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .sb-item-dot {
    align-self: center;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    display: none;
  }
  .sb-item[data-unread="true"] .sb-item-dot { display: block; }
  .sb-item[data-unread="true"] .sb-item-title { font-weight: 600; color: var(--fg); }
  /* quick-delete ×: replaces the time slot on row hover */
  .sb-item-x {
    align-self: center;
    display: none;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--fg-dim);
    width: 20px;
    height: 20px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
  }
  .sb-item:hover .sb-item-time { display: none; }
  .sb-item:hover .sb-item-x { display: inline-flex; }
  .sb-item-x:hover { background: var(--red-soft); color: var(--red-text); }
  /* keyboard: rows are focusable (Tab or ↑/↓ to move, Enter opens, Delete trashes) */
  .sb-item:focus, .sb-item-x:focus { outline: none; }
  .sb-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* drag to reorder: the grabbed row follows the pointer, rows it passes slide aside */
  .sb-pages.sorting .sb-item { cursor: grabbing; transition: transform 0.15s ease; }
  .sb-pages.sorting .sb-item:hover .sb-item-time { display: inline; }
  .sb-pages.sorting .sb-item:hover .sb-item-x { display: none; }
  .sb-pages.sorting .sb-item.dragging {
    z-index: 1;
    transition: none;
    color: var(--fg);
    background: var(--drag-bg);
    box-shadow: var(--drag-shadow);
  }
  .sb-pages.sorting .sb-item.dragging.settling { transition: transform 0.15s ease; }
  .sb-pages.sorting.autoscrolling .sb-item { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .sb-pages.sorting .sb-item, .sb-pages.sorting .sb-item.dragging.settling { transition: none; }
  }

  .sb-empty {
    padding: 18px 14px;
    font-size: 12.5px;
    color: var(--fg-dim);
    text-align: center;
  }

  .sb-foot {
    border-top: 1px solid var(--border);
    padding: 6px;
  }
  .sb-foot-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 5px 8px;
    border: none;
    background: transparent;
    border-radius: 6px;
    color: var(--fg-dim);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .sb-foot-btn:hover { background: var(--hover); color: var(--fg-mid); }
  .sb-foot-btn .ic { width: 20px; display: inline-flex; justify-content: center; flex-shrink: 0; }
  /* the destructive action sits last, under a separator, and turns red when targeted */
  .sb-foot-sep { height: 1px; margin: 4px 0; border: none; background: var(--border); }   /* as wide as the buttons' hover pills */
  .sb-foot-btn.danger:hover, .sb-foot-btn.danger:focus-visible { background: var(--red-soft); color: var(--red-text); }
  /* line icons (Lucide paths) for the panel's own controls */
  .ico { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* narrow windows: the sidebar becomes an overlay, closed until opened with » */
  .sb-scrim { display: none; }
  @media (max-width: 640px) {
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; box-shadow: var(--shadow-menu); }
    .app[data-sidebar="closed"] .sidebar { box-shadow: none; }
    .app[data-sidebar="open"] .sb-scrim { display: block; position: fixed; inset: 0; z-index: 50; background: rgba(15, 15, 15, 0.35); }
  }

  /* ---------------- Main column ---------------- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .topbar {
    height: 45px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    user-select: none;
  }
  .app[data-sidebar="open"] #btn-sb-open { display: none; }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
    font-size: 13.5px;
    color: var(--fg);
  }
  .crumb-root { color: var(--fg-mid); flex-shrink: 0; }
  .crumb-sep { color: var(--fg-faint); flex-shrink: 0; }
  .crumb-page {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    overflow: hidden;
  }
  .crumb-page .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb-page > span:first-child { color: var(--fg-solid); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .status { display: inline-flex; align-items: center; }
  .status-text { font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
  .status-text:empty { display: none; }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fg-faint);
    margin: 0 6px;
    transition: background 0.2s ease;
  }
  .status-dot.connected { background: var(--green); }
  .status-dot.error { background: var(--red); }

  /* dropdown menu (•••) */
  .menu {
    position: fixed;
    z-index: 200;
    min-width: 200px;
    background: var(--bg-modal);
    border-radius: 8px;
    box-shadow: var(--shadow-menu);
    padding: 5px;
    display: none;
  }
  .menu[data-open="true"] { display: block; animation: pop 0.12s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 6px 9px;
    border: none;
    background: transparent;
    border-radius: 5px;
    color: var(--fg);
    font-size: 13.5px;
    cursor: pointer;
    text-align: left;
  }
  .menu-item:hover { background: var(--hover); }
  .menu-item.danger { color: var(--red-text); }
  .menu-item.danger:hover { background: var(--red-soft); }
  .menu-item .ic { width: 20px; display: inline-flex; justify-content: center; flex-shrink: 0; }

  /* ---------------- Page (document) area ---------------- */
  .page-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .page {
    /* Kenny: no max-width cap — text fills the content area */
    max-width: none;
    margin: 0;
    padding: 40px 64px 30vh;
  }
  @media (max-width: 900px) { .page { padding: 30px 40px 25vh; } }
  @media (max-width: 600px) { .page { padding: 24px 24px 25vh; } }

  .page-icon-big {
    font-size: 68px;
    line-height: 1.1;
    margin-bottom: 4px;
    user-select: none;
    color: var(--fg-solid);
  }
  .page-title {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    word-break: break-word;
  }
  .page-meta {
    font-size: 12px;
    color: var(--fg-dim);
    margin-bottom: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }

  .empty-state {
    text-align: center;
    padding: 18vh 20px 0;
    color: var(--fg-dim);
    user-select: none;
  }
  .empty-state .big { font-size: 52px; margin-bottom: 12px; }
  .empty-state .h { font-size: 17px; font-weight: 600; color: var(--fg-mid); margin-bottom: 6px; }
  .empty-state .s { font-size: 13.5px; color: var(--fg-dim); }
  .empty-state code {
    background: var(--inline-code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* ============================================================
     Notion typography inside the page body
     ============================================================ */
  .page-body { font-size: 16px; color: var(--fg); }
  .page-body > * { position: relative; }

  /* block hover handle (decorative ⋮⋮) */
  .page-body > *:hover::before {
    content: "⋮⋮";
    position: absolute;
    left: -26px;
    top: 0.35em;
    font-size: 11px;
    letter-spacing: -1px;
    color: var(--fg-faint);
    cursor: grab;
  }
  @media (max-width: 900px) { .page-body > *:hover::before { content: none; } }

  .page-body h1, .page-body h2, .page-body h3,
  .page-body h4, .page-body h5, .page-body h6 {
    font-weight: 600;
    line-height: 1.3;
    margin: 1.4em 0 4px;
    letter-spacing: -0.01em;
  }
  .page-body h1 { font-size: 28px; margin-top: 1.6em; }
  .page-body h2 { font-size: 22px; }
  .page-body h3 { font-size: 18px; }
  .page-body h4, .page-body h5, .page-body h6 { font-size: 16px; }
  .page-body p { margin: 2px 0 1px; padding: 3px 0; }
  .page-body a { color: inherit; text-decoration: underline; text-decoration-color: var(--fg-faint); text-underline-offset: 2px; transition: text-decoration-color 0.1s; }
  .page-body a:hover { text-decoration-color: var(--fg-mid); }

  .page-body ul, .page-body ol { margin: 2px 0; padding-left: 26px; }
  .page-body li { padding: 2px 0; }
  .page-body li::marker { color: var(--fg); }

  .page-body blockquote {
    margin: 6px 0;
    padding: 14px 16px 14px 46px;
    background: var(--callout-bg);
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--fg);
    position: relative;
  }
  .page-body blockquote::before {
    content: "💡";
    position: absolute;
    left: 15px;
    top: 13px;
    font-size: 16px;
  }
  .page-body blockquote > *:first-child { margin-top: 0; padding-top: 0; }
  .page-body blockquote > *:last-child { margin-bottom: 0; padding-bottom: 0; }

  .page-body hr {
    border: none;
    border-top: 1px solid var(--border-strong);
    margin: 12px 0;
  }

  .page-body table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 14.5px;
    width: 100%;
  }
  .page-body th, .page-body td {
    border: 1px solid var(--border-strong);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
  }
  .page-body th {
    background: var(--hover);
    font-weight: 600;
    color: var(--fg-mid);
    font-size: 13.5px;
  }
  .page-body img { max-width: 100%; border-radius: 4px; }

  .page-body code:not([class*="language-"]) {
    background: var(--inline-code-bg);
    color: var(--inline-code-fg);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 0.85em;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  /* ---------------- Notion code block ---------------- */
  .code-block {
    margin: 8px 0;
    border-radius: 8px;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    overflow: hidden;
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 0 14px;
    user-select: none;
  }
  .code-lang {
    font-size: 11.5px;
    color: var(--fg-dim);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    text-transform: lowercase;
  }
  .code-copy {
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--fg-dim);
    font-size: 11.5px;
    padding: 3px 8px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.1s ease;
  }
  .code-block:hover .code-copy { opacity: 1; }
  .code-copy:hover { background: var(--hover); color: var(--fg-mid); }
  .code-copy.done { color: var(--green); opacity: 1; }
  .code-block pre {
    margin: 0;
    padding: 8px 16px 14px;
    overflow-x: auto;
    background: transparent;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .code-block pre code {
    background: transparent;
    padding: 0;
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    text-shadow: none;
  }

  /* Prism token colors via CSS variables (both themes) */
  .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tok-comment); font-style: italic; }
  .token.punctuation { color: var(--tok-punct); }
  .token.keyword, .token.atrule, .token.important { color: var(--tok-keyword); }
  .token.string, .token.char, .token.attr-value, .token.regex { color: var(--tok-string); }
  .token.function, .token.selector { color: var(--tok-function); }
  .token.number, .token.boolean, .token.constant, .token.symbol { color: var(--tok-number); }
  .token.class-name, .token.builtin, .token.attr-name, .token.tag { color: var(--tok-class); }
  .token.operator, .token.entity, .token.url { color: var(--tok-operator); background: transparent; }
  .token.variable, .token.property { color: var(--tok-variable); }
  .token.inserted { color: var(--green); }
  .token.deleted { color: var(--red); }
  .token.bold { font-weight: 600; }
  .token.italic { font-style: italic; }

  /* ---------------- KaTeX & Mermaid ---------------- */
  .katex { font-size: 1.05em; }
  strong .katex, b .katex { font-weight: bold; }   /* **$x$** bolds the formula as well */
  .katex-display {
    margin: 0.9em 0 !important;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 0;
  }
  .katex-display > .katex { white-space: nowrap; }
  .math-error {
    background: var(--red-soft);
    border: 1px solid var(--red);
    color: var(--red-text);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 0.85em;
  }
  /* a diagram wider than the column scrolls sideways; its edges fade while
     there is more that way (more-left / more-right come from syncSideFades) */
  .mermaid {
    text-align: center;
    margin: 10px 0;
    overflow-x: auto;
    --fade-left: 0px;
    --fade-right: 0px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade-left), #000 calc(100% - var(--fade-right)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fade-left), #000 calc(100% - var(--fade-right)), transparent);
  }
  .mermaid.more-left { --fade-left: 32px; }
  .mermaid.more-right { --fade-right: 32px; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* ============================================================
     Trash modal (Notion-style)
     ============================================================ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 15, 0.6);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 90px 20px 40px;
    overflow-y: auto;
  }
  .modal-backdrop[data-open="true"] { display: flex; }
  .modal {
    background: var(--bg-modal);
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 160px);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-modal);
    animation: pop 0.15s ease;
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 14.5px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
  .modal-head .hint { font-size: 11.5px; color: var(--fg-dim); }
  .modal-body { overflow-y: auto; padding: 8px; flex: 1; }
  .trash-empty { text-align: center; padding: 40px 20px; color: var(--fg-dim); font-size: 13px; }
  .trash-item {
    border-radius: 6px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .trash-item:hover { background: var(--hover); }
  .trash-row { display: flex; align-items: center; gap: 10px; }
  .trash-title {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--fg);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .trash-title:hover { color: var(--accent); }
  .trash-meta {
    font-size: 10.5px;
    color: var(--fg-dim);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .trash-meta .purge { color: var(--yellow); }
  .trash-restore {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .trash-restore:hover { border-color: var(--accent); background: var(--accent-soft); }
  .trash-restore[disabled] { opacity: 0.5; cursor: progress; }
  .trash-preview {
    display: none;
    border-top: 1px solid var(--border);
    padding: 8px 4px 4px;
    font-size: 13px;
    max-height: 260px;
    overflow-y: auto;
  }
  .trash-item[data-expanded="true"] .trash-preview { display: block; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" crossorigin="anonymous"></script>

<script>
  if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
    Prism.plugins.autoloader.languages_path =
      'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';
  }

  // ---- Theme ----
  const THEME_KEY = 'sisyphus-panel-theme';
  function currentTheme() {
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }
  function initMermaidForTheme(theme) {
    mermaid.initialize({
      startOnLoad: false,
      theme: theme === 'dark' ? 'dark' : 'default',
      securityLevel: 'loose',
    });
  }
  (function () {
    let stored;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
    // Notion defaults to light; keep dark if the user chose it before.
    document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
  })();
  initMermaidForTheme(currentTheme());

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // marked.code() signature differs across versions: v9-v14 use positional
  // (code, lang, escaped); v15+ pass a single token object {text, lang, ...}.
  marked.use({
    gfm: true,
    breaks: false,
    renderer: {
      code(codeOrToken, infostring, _escaped) {
        const isTokenObject = codeOrToken !== null && typeof codeOrToken === 'object';
        const text = isTokenObject ? (codeOrToken.text ?? '') : (codeOrToken ?? '');
        const langRaw = isTokenObject ? (codeOrToken.lang ?? '') : (infostring ?? '');
        const lang = String(langRaw).trim().split(/\s+/)[0];

        if (lang === 'mermaid') {
          return `<div class="mermaid" data-source="${encodeURIComponent(text)}">${escapeHtml(text)}</div>`;
        }
        const escaped = escapeHtml(text);
        const langClass = lang ? ` class="language-${lang}"` : '';
        return `<figure class="code-block">
          <div class="code-head">
            <span class="code-lang">${escapeHtml(lang || 'plain text')}</span>
            <button class="code-copy" type="button" data-code="${encodeURIComponent(text)}">Copy</button>
          </div>
          <pre${langClass}><code${langClass}>${escaped}</code></pre>
        </figure>`;
      }
    }
  });

  // Math: $..$, $$..$$, \(..\) and \[..\] come out before marked sees the text
  // (so _ * \ inside formulas aren't read as markdown); KaTeX goes back in
  // afterwards. The placeholders are private-use characters, not HTML
  // comments: a comment at the start of a line made marked treat the whole
  // line as raw HTML, so **bold** on a line that began with a formula never
  // rendered. Display math that starts its line keeps a comment placeholder
  // on purpose, so it is a block of its own (text after it on that line moves
  // to the next line); display math after text stays inside that paragraph.
  // Which delimiters count is asked from marked itself (mdCensus): a $ or \(
  // in code (fenced or indented, also inside lists and quotes, or a code
  // span), in a link target or title, or in an image's alt text stays
  // literal, and so does an escaped \$.
  const CJK_RE = /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}\u3000-\u303F\uFF00-\uFFEF]/u;
  const PUNCT_RE = /[\p{P}\p{S}]/u;
  const PROBE_BASE = 0xF0000;   // private-use plane: one code point per $, \( and ** run
  const INLINE_ROOTS = new Set(['paragraph', 'heading', 'text']);

  // Lexes a copy of src in which every $, \( \) \[ \] and ** run is a unique
  // private-use character, then reads off where each one landed: in code or a
  // link target (so it is literal), and for ** runs, which inline context
  // (paragraph, heading, list item, table cell) they belong to - CommonMark
  // pairs them per context, not per line.
  function mdCensus(src) {
    const marks = [];
    let probe = '';
    let last = 0;
    for (const m of src.matchAll(/\\[()[\]]|\$|\*{2,}/g)) {
      let backslashes = 0;
      while (src[m.index - backslashes - 1] === '\\') backslashes++;
      const star = m[0][0] === '*';
      if (star && backslashes % 2) continue;   // \** is an escaped * and a single *
      if (star && /^ {0,3}(?:\*[ \t]*){3,}$/.test(lineAround(src, m.index))) continue;   // a *** rule
      if (marks.length > 0xFFFD) break;
      marks.push({ pos: m.index, len: m[0].length, star, literal: !star && backslashes % 2 === 1, ctx: -1 });
      probe += src.slice(last, m.index) + String.fromCodePoint(PROBE_BASE + marks.length - 1).repeat(m[0].length);
      last = m.index + m[0].length;
    }
    probe += src.slice(last);
    const each = (s, fn) => {
      for (const ch of s || '') {
        const m = marks[ch.codePointAt(0) - PROBE_BASE];
        if (m) fn(m);
      }
    };
    const literal = s => each(s, m => { m.literal = true; });
    let contexts = 0;
    const walk = (t, ctx) => {
      switch (t.type) {
        case 'code': case 'codespan': case 'image': literal(t.raw); return;
        case 'html': return;
        case 'link': literal(t.href); literal(t.title); break;
        case 'list': for (const item of t.items) walk(item, null); return;
        case 'table':
          for (const cell of [...t.header, ...t.rows.flat()]) {
            const c = contexts++;
            for (const x of cell.tokens) walk(x, c);
          }
          return;
      }
      if (t.tokens) {
        const inner = ctx ?? (INLINE_ROOTS.has(t.type) ? contexts++ : null);
        for (const x of t.tokens) walk(x, inner);
      } else if (ctx != null) {
        each(t.raw, m => { if (m.star && m.ctx < 0) m.ctx = ctx; });
      }
    };
    const tokens = marked.lexer(probe);
    for (const t of tokens) walk(t, null);
    for (const def of Object.values(tokens.links || {})) { literal(def.href); literal(def.title); }
    return marks;
  }

  function lineAround(s, at) {
    const start = s.lastIndexOf('\n', at - 1) + 1;
    const end = s.indexOf('\n', at);
    return s.slice(start, end < 0 ? s.length : end);
  }

  function renderMarkdown(src) {
    const marks = mdCensus(src);
    const blocks = [];
    const inlines = [];
    const stash = (list, value, open, close) => { list.push(value); return open + (list.length - 1) + close; };

    // The formulas are found on a copy where literal delimiters can't match (a
    // literal $ becomes \uE007, the \ of a literal \( \) \[ \] becomes \uE008).
    // Every replacement keeps the length, so offsets stay those of src.
    let w = '';
    let pos = 0;
    for (const m of marks) {
      if (m.star || !m.literal) continue;
      w += src.slice(pos, m.pos) + (m.len === 1 ? '\uE007' : '\uE008' + src[m.pos + 1]);
      pos = m.pos + m.len;
    }
    w += src.slice(pos);
    const spans = [];
    const take = (m, start, kind, eq, skip = 0, next = '') => {
      if (m.includes('\uE009')) return m;   // overlaps a formula found earlier
      spans.push({ start, end: start + m.length + skip, kind, eq, next });
      return '\uE009'.repeat(m.length);
    };
    const display = (m, at) => {
      const before = src.slice(src.lastIndexOf('\n', at - 1) + 1, at);
      const lineEnd = src.indexOf('\n', at + m.length);
      const after = src.slice(at + m.length, lineEnd < 0 ? src.length : lineEnd);
      let eq = src.slice(at + 2, at + m.length - 2);
      if (/[^\s>]/.test(before)) return take(m, at, 'mid', eq);
      if (before.includes('>')) eq = eq.replace(/^[ \t]*(?:>[ \t]?)+/gm, '');   // inside a quote
      if (!after.trim()) return take(m, at, 'block', eq);
      return take(m, at, 'block', eq, after.length - after.trimStart().length, '\n' + before);
    };
    w = w.replace(/\\\[([\s\S]+?)\\\]/g, (m, _eq, at) => display(m, at));
    w = w.replace(/\$\$([\s\S]+?)\$\$/g, (m, _eq, at) => display(m, at));
    w = w.replace(/\\\(([\s\S]+?)\\\)/g, (m, _eq, at) => take(m, at, 'inline', src.slice(at + 2, at + m.length - 2)));
    w = w.replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\$)/g, (m, pre, _eq, at) =>
      pre + take(m.slice(pre.length), at + pre.length, 'inline', src.slice(at + pre.length + 1, at + m.length - 1)));

    // CJK-friendly bold. CommonMark won't open bold when the inner side is
    // punctuation and the outer side a letter, nor close it in the mirrored
    // spot, which breaks Chinese like 是**“术语”**的 or 很**重要。**下. Within each
    // inline context the ** runs pair up in order (1st opens, 2nd closes, ...),
    // and only where such a run would fail does a hair space (whitespace to
    // marked) go on its CJK side; \uE006 tags it so it is removed again. A
    // closer like 状态量**： is left as it is: CommonMark already accepts it.
    // Contexts with an odd number of runs, or with *** runs, are left alone.
    const inFormula = at => spans.some(s => at >= s.start && at < s.end);
    const byContext = new Map();
    for (const m of marks) {
      if (!m.star || m.literal || m.ctx < 0 || inFormula(m.pos)) continue;
      if (!byContext.has(m.ctx)) byContext.set(m.ctx, []);
      byContext.get(m.ctx).push(m);
    }
    const edits = spans.map(s => ({ at: s.start, span: s }));
    for (const runs of byContext.values()) {
      if (runs.length % 2 || runs.some(r => r.len !== 2)) continue;
      runs.forEach((r, k) => {
        const prev = src[r.pos - 1] || '';
        const next = src[r.pos + 2] || '';
        if (k % 2 === 0 && PUNCT_RE.test(next) && CJK_RE.test(prev) && !PUNCT_RE.test(prev)) edits.push({ at: r.pos, text: '\uE006\u200A' });
        if (k % 2 === 1 && PUNCT_RE.test(prev) && CJK_RE.test(next) && !PUNCT_RE.test(next)) edits.push({ at: r.pos + 2, text: '\u200A\uE006' });
      });
    }
    edits.sort((a, b) => a.at - b.at);

    let txt = '';
    pos = 0;
    for (const e of edits) {
      txt += src.slice(pos, e.at);
      if (e.span) {
        const s = e.span;
        txt += s.kind === 'inline' ? stash(inlines, s.eq, '\uE000', '\uE001')
          : s.kind === 'block' ? stash(blocks, s.eq, '<!--MB', '-->') + s.next
          : stash(blocks, s.eq, '\uE002', '\uE003');
        pos = s.end;
      } else {
        txt += e.text;
        pos = e.at;
      }
    }
    txt += src.slice(pos);
    return marked.parse(txt)
      .replace(/\uE006\u200A|\u200A\uE006/g, '')
      .replace(/<!--MB(\d+)-->|\uE002(\d+)\uE003/g, (_m, a, b) => katexHtml(blocks[a ?? b], true))
      .replace(/\uE000(\d+)\uE001/g, (_m, i) => katexHtml(inlines[i], false));
  }

  function katexHtml(eq, display) {
    try {
      return katex.renderToString(eq, { displayMode: display, throwOnError: false, output: 'html' });
    } catch (e) {
      return display
        ? `<div class="math-error">KaTeX block error: ${escapeHtml(e.message)}</div>`
        : `<span class="math-error">$${escapeHtml(eq)}$</span>`;
    }
  }

  // ---- Title / icon extraction ----
  function extractTitleInfo(content, filename) {
    const src = content || '';
    const lines = src.split('\n');
    let inFence = false;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^```/.test(line)) { inFence = !inFence; continue; }
      if (inFence) continue;
      const h = line.match(/^\s*#+\s+(.+?)\s*#*\s*$/);
      if (h) return { title: h[1].trim(), headingLine: i };
    }
    inFence = false;
    for (const line of lines) {
      if (/^```/.test(line)) { inFence = !inFence; continue; }
      if (inFence) continue;
      const t = line.trim();
      if (!t) continue;
      if (t.startsWith('<!--') || t.startsWith('---')) continue;
      return { title: t.length > 80 ? t.slice(0, 80) + '\u2026' : t, headingLine: -1 };
    }
    return { title: filename, headingLine: -1 };
  }

  let EMOJI_RE = null;
  try {
    EMOJI_RE = new RegExp('^(\\p{Extended_Pictographic}(?:\\uFE0F|\\u200D\\p{Extended_Pictographic})*)\\s*', 'u');
  } catch (e) { /* older engines: no icon extraction */ }

  function pageMeta(msg) {
    const info = extractTitleInfo(msg.content, msg.filename);
    let icon = '📄';
    let title = info.title;
    if (EMOJI_RE) {
      const m = title.match(EMOJI_RE);
      if (m) {
        icon = m[1];
        title = title.slice(m[0].length) || msg.filename;
      }
    }
    return { icon, title, headingLine: info.headingLine };
  }

  // Body content = source minus the heading line used as the page title
  // (only when the title came from a markdown heading; plain-text fallback
  // titles stay in the body so no content is lost).
  function bodySource(msg, meta) {
    if (meta.headingLine < 0) return msg.content || '';
    const lines = (msg.content || '').split('\n');
    lines.splice(meta.headingLine, 1);
    return lines.join('\n');
  }

  // ---- Formatting helpers ----
  function formatTime(unixSec) {
    return new Date(unixSec * 1000).toLocaleString('en-US', { hour12: false });
  }
  function formatShort(unixSec) {
    const d = new Date(unixSec * 1000);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
      return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
    }
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }
  function formatPurgeIn(purgeAtSec) {
    const diffMs = purgeAtSec * 1000 - Date.now();
    if (diffMs <= 0) return 'purging soon';
    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000) / 3600000);
    if (days > 0) return `purges in ${days}d ${hours}h`;
    const mins = Math.floor((diffMs % 3600000) / 60000);
    return hours > 0 ? `purges in ${hours}h ${mins}m` : `purges in ${mins}m`;
  }

  // ---- State ----
  const store = new Map();          // id -> {id, filename, mtime, content, unread}
  let activeId = null;
  let initialSyncDone = false;
  let searchQuery = '';
  let pageOrder = [];               // sidebar order shown: filenames, top first (GET/PUT /order)
  let serverOrder = [];             // last order the server confirmed; a failed save falls back to it
  let orderRev = 0;                 // bumps on every order change, so a slow GET /order can't undo a newer one
  let drag = null;                  // sidebar drag-to-reorder in progress (see "Drag to reorder")

  const appEl = document.getElementById('app');
  const sbPagesEl = document.getElementById('sb-pages');
  const pageEl = document.getElementById('page');
  const pageScrollEl = document.getElementById('page-scroll');
  const crumbSepEl = document.getElementById('crumb-sep');
  const crumbPageEl = document.getElementById('crumb-page');
  const statusDotEl = document.getElementById('status-dot');
  const statusTextEl = document.getElementById('status-text');
  const narrowMq = window.matchMedia('(max-width: 640px)');   // below this the sidebar is an overlay
  const searchEl = document.getElementById('search');
  const menuEl = document.getElementById('menu');
  const btnMenu = document.getElementById('btn-menu');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalBody = document.getElementById('modal-body');
  const sortNewestBtn = document.getElementById('btn-sort-newest');

  function setStatus(state, text) {
    statusDotEl.classList.remove('connected', 'error');
    if (state) statusDotEl.classList.add(state);
    statusDotEl.title = text;
    // spelled out (and announced via role=status) unless all is well
    statusTextEl.textContent = state === 'connected' ? '' : text.charAt(0).toUpperCase() + text.slice(1).replace('...', '…');
  }

  // Pages missing from the saved order (new arrivals) come first, newest
  // first; the rest follow the saved order. Nothing saved = newest first.
  function sortedMessages() {
    const rank = new Map(pageOrder.map((name, i) => [name, i]));
    const rankOf = msg => rank.has(msg.filename) ? rank.get(msg.filename) : -1;
    return [...store.values()].sort((a, b) => (rankOf(a) - rankOf(b)) || (b.mtime - a.mtime));
  }

  // Saved order from the server: [] when none is saved or the running server
  // predates /order (the sidebar then stays newest first); null when it can't
  // be read right now, so the caller keeps the order it already shows.
  async function fetchOrder() {
    try {
      const res = await fetch('/order');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return Array.isArray(data.order) ? data.order : [];
    } catch (e) {
      console.warn('page order unavailable:', e.message);
      return e.message === 'HTTP 404' ? [] : null;
    }
  }

  // An order the server pushed (SSE): every tab shows the same one.
  function applyOrder(order) {
    if (!Array.isArray(order)) return;
    serverOrder = order;
    orderRev++;
    if (order.length === pageOrder.length && order.every((name, i) => name === pageOrder[i])) return;
    pageOrder = order;
    renderSidebar();
  }

  async function saveOrder(order) {
    pageOrder = order;   // optimistic: the sidebar already shows it
    orderRev++;
    try {
      const res = await fetch('/order', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (pageOrder === order) serverOrder = order;
    } catch (e) {
      // Back to the last order the server confirmed (the order before this
      // attempt may never have been saved either), unless something newer
      // has replaced this one already.
      if (pageOrder === order) { pageOrder = serverOrder; orderRev++; renderSidebar(); }
      // 404 / 501 = a panel.py from before /order existed (it has no PUT at all)
      const hint = /^HTTP (404|501)$/.test(e.message)
        ? '\n\nThe running panel server is older than this page. Restart it to enable reordering.'
        : '';
      alert(`Could not save the page order: ${e.message}${hint}`);
    }
  }

  // ---- Sidebar ----
  function renderSidebar() {
    // Rebuilding the rows mid-drag would pull the grabbed row out from under
    // the pointer; finishDrag() re-renders once the drop has settled.
    if (drag && drag.phase !== 'pressed') return;
    sortNewestBtn.hidden = !pageOrder.length;
    // rows are rebuilt from scratch: remember which one had keyboard focus (and
    // where, so the focus moves to its neighbour if that row is gone)
    const focusedRow = document.activeElement?.closest?.('#sb-pages .sb-item');
    const focusedId = focusedRow?.dataset.id;
    const focusedIdx = focusedRow ? [...sbPagesEl.children].indexOf(focusedRow) : -1;
    const list = sortedMessages().filter(msg => {
      if (!searchQuery) return true;
      const meta = pageMeta(msg);
      const q = searchQuery.toLowerCase();
      return meta.title.toLowerCase().includes(q)
          || msg.filename.toLowerCase().includes(q)
          || (msg.content || '').toLowerCase().includes(q);
    });

    sbPagesEl.innerHTML = '';
    if (!list.length) {
      const d = document.createElement('div');
      d.className = 'sb-empty';
      d.textContent = searchQuery ? 'No results' : 'No pages yet';
      sbPagesEl.appendChild(d);
      syncListFades();
      return;
    }
    for (const msg of list) {
      const meta = pageMeta(msg);
      const item = document.createElement('div');
      item.className = 'sb-item' + (msg.id === activeId ? ' active' : '');
      item.dataset.id = msg.id;
      item.dataset.unread = msg.unread ? 'true' : 'false';
      item.title = `${meta.title}\n${msg.filename}`;
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-keyshortcuts', 'Enter Delete Alt+ArrowUp Alt+ArrowDown');
      if (msg.id === activeId) item.setAttribute('aria-current', 'page');
      item.innerHTML = `
        <span class="sb-item-icon">${escapeHtml(meta.icon)}</span>
        <span class="sb-item-title">${escapeHtml(meta.title)}</span>
        <span class="sb-item-dot"></span>
        <span class="sb-item-time">${formatShort(msg.mtime)}</span>
        <button class="sb-item-x" type="button" tabindex="-1" title="Move to Trash" aria-label="Move to Trash">✕</button>
      `;
      item.addEventListener('click', () => {
        openPage(msg.id);
        if (narrowMq.matches) setSidebar(false);   // overlay: get out of the way
      });
      item.querySelector('.sb-item-x').addEventListener('click', async ev => {
        ev.stopPropagation();
        try {
          const res = await fetch(`/messages/${encodeURIComponent(msg.filename)}`, { method: 'DELETE' });
          // 404: another tab already moved it to the trash, so just drop the row
          if (!res.ok && res.status !== 404) throw new Error(`HTTP ${res.status}`);
          removeMessage(msg);
        } catch (e) {
          alert('Delete failed: ' + e.message);
        }
      });
      sbPagesEl.appendChild(item);
    }
    if (focusedRow) {
      const rows = sbPagesEl.querySelectorAll('.sb-item');
      (sbPagesEl.querySelector(`.sb-item[data-id="${CSS.escape(focusedId)}"]`) || rows[Math.min(focusedIdx, rows.length - 1)])?.focus({ preventScroll: true });
    }
    syncListFades();
  }

  // more-above / more-below drive the fades at the list's top and bottom edge
  function syncListFades() {
    const { scrollTop, scrollHeight, clientHeight } = sbPagesEl;
    sbPagesEl.classList.toggle('more-above', scrollTop > 1);
    sbPagesEl.classList.toggle('more-below', scrollTop + clientHeight < scrollHeight - 1);
  }
  sbPagesEl.addEventListener('scroll', syncListFades, { passive: true });
  window.addEventListener('resize', syncListFades);
  function syncSideFades(el) {
    el.classList.toggle('more-left', el.scrollLeft > 1);
    el.classList.toggle('more-right', el.scrollLeft < el.scrollWidth - el.clientWidth - 1);
  }

  // ---- Page render ----
  function renderEmptyPage() {
    crumbSepEl.style.display = 'none';
    crumbPageEl.innerHTML = '';
    pageEl.innerHTML = `
      <div class="empty-state">
        <div class="big">🪨</div>
        <div class="h">No pages yet</div>
        <div class="s">Drop a <code>.md</code> file into <code>messages/</code> and it will appear here.</div>
      </div>`;
  }

  function openPage(id) {
    const msg = store.get(id);
    if (!msg) return;
    activeId = id;
    msg.unread = false;
    renderPage(msg);
    renderSidebar();
    pageScrollEl.scrollTop = 0;
  }

  // Left edge of the ink of `text` as drawn in `el`'s font, relative to the pen.
  const inkCtx = document.createElement('canvas').getContext('2d');
  function inkLeft(el, text) {
    inkCtx.font = getComputedStyle(el).font;
    return -inkCtx.measureText(text).actualBoundingBoxLeft;
  }

  function renderPage(msg) {
    const meta = pageMeta(msg);

    crumbSepEl.style.display = '';
    crumbPageEl.innerHTML = `<span>${escapeHtml(meta.icon)}</span><span class="t">${escapeHtml(meta.title)}</span>`;

    pageEl.innerHTML = '';
    const icon = document.createElement('div');
    icon.className = 'page-icon-big';
    icon.textContent = meta.icon;
    pageEl.appendChild(icon);

    const h = document.createElement('h1');
    h.className = 'page-title';
    h.textContent = meta.title;
    pageEl.appendChild(h);
    // Emoji glyphs carry wide side bearings (10-20px at this size), which made
    // the icon look indented; line its ink up with the title's.
    icon.style.marginLeft = `${(inkLeft(h, meta.title) - inkLeft(icon, meta.icon)).toFixed(1)}px`;

    const metaEl = document.createElement('div');
    metaEl.className = 'page-meta';
    metaEl.innerHTML = `<span>${formatTime(msg.mtime)}</span><span class="fn">${escapeHtml(msg.filename)}</span>`;
    pageEl.appendChild(metaEl);

    const body = document.createElement('div');
    body.className = 'page-body';
    body.innerHTML = renderMarkdown(bodySource(msg, meta));
    pageEl.appendChild(body);

    runEnhancements(body, msg);
  }

  function runEnhancements(root, msg) {
    root.querySelectorAll('.mermaid').forEach((el, idx) => {
      const source = decodeURIComponent(el.dataset.source || '');
      const id = `mmd-${msg.id}-${Date.now()}-${idx}`.replace(/[^\w-]/g, '_');
      mermaid.render(id, source).then(({ svg, bindFunctions }) => {
        el.innerHTML = svg;
        if (bindFunctions) bindFunctions(el);
        // A very wide diagram shrinks to fit only down to 70% of its size; past
        // that the block scrolls sideways instead of shrinking the text further.
        const svgEl = el.querySelector('svg');
        const natural = svgEl?.viewBox?.baseVal?.width;
        if (natural) svgEl.style.minWidth = `${Math.round(natural * 0.7)}px`;
        syncSideFades(el);
        el.addEventListener('scroll', () => syncSideFades(el), { passive: true });
        new ResizeObserver(() => syncSideFades(el)).observe(el);
      }).catch(err => {
        el.innerHTML = `<div class="math-error">Mermaid error: ${escapeHtml(err.message || String(err))}</div>
                        <pre><code>${escapeHtml(source)}</code></pre>`;
      });
    });

    root.querySelectorAll('.code-copy').forEach(btn => {
      btn.addEventListener('click', async () => {
        const text = decodeURIComponent(btn.dataset.code || '');
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e2) { /* give up */ }
          ta.remove();
        }
        btn.textContent = 'Copied ✓';
        btn.classList.add('done');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1600);
      });
    });

    if (window.Prism) {
      try { Prism.highlightAllUnder(root); } catch (e) { /* ignore */ }
    }
  }

  function rerenderAllMermaid() {
    const msg = store.get(activeId);
    if (msg) renderPage(msg);
  }

  // ---- Store mutations ----
  function upsertMessage(msg, { live }) {
    const prev = store.get(msg.id);
    const changed = !prev || prev.mtime !== msg.mtime;
    store.set(msg.id, {
      ...msg,
      unread: changed && live && msg.id !== activeId ? true : (prev ? prev.unread : false),
    });
    if (!changed) { renderSidebar(); return; }

    if (live) {
      // New arrival (or edit) while panel is live: auto-open to keep the
      // real-time feed feel of the old layout.
      openPage(msg.id);
    } else {
      if (msg.id === activeId) renderPage(store.get(msg.id));
      renderSidebar();
    }
  }

  function removeMessage(msg) {
    store.delete(msg.id);
    if (activeId === msg.id) {
      const next = sortedMessages()[0];
      activeId = null;
      if (next) openPage(next.id);
      else { renderEmptyPage(); renderSidebar(); }
    } else {
      renderSidebar();
    }
  }

  // ---- History / SSE ----
  async function loadHistory() {
    try {
      const rev = orderRev;
      const [res, order] = await Promise.all([fetch('/messages'), fetchOrder()]);
      const list = await res.json();
      // Skip the fetched order if it couldn't be read, or if a newer one (a drop
      // here, or SSE) arrived while it was in flight.
      if (order && rev === orderRev) { pageOrder = order; serverOrder = order; }
      list.sort((a, b) => a.mtime - b.mtime);
      list.forEach(m => upsertMessage(m, { live: false }));
      if (!activeId && list.length) openPage(list[list.length - 1].id);
      if (!list.length && !store.size) { renderEmptyPage(); renderSidebar(); }
      initialSyncDone = true;
    } catch (e) {
      console.error('load history failed', e);
    }
  }

  function connectSSE() {
    setStatus('', 'connecting...');
    const es = new EventSource('/events');
    es.onopen = () => {
      setStatus('connected', 'connected');
      // Re-sync history on every (re)connect: files that landed while SSE was
      // down would never reach us via events alone.
      loadHistory();
    };
    es.addEventListener('message', ev => {
      try { upsertMessage(JSON.parse(ev.data), { live: initialSyncDone }); }
      catch (e) { console.error(e); }
    });
    es.addEventListener('delete', ev => {
      try { removeMessage(JSON.parse(ev.data)); }
      catch (e) { console.error(e); }
    });
    es.addEventListener('order', ev => {
      try { applyOrder(JSON.parse(ev.data).order); }
      catch (e) { console.error(e); }
    });
    es.onerror = () => setStatus('error', 'reconnecting...');
  }

  // ---- Sidebar chrome ----
  // Closed, the sidebar is hidden, so the keyboard focus can't stay in it:
  // closing hands the focus to », and opening from » moves it onto the open
  // page's row.
  const sidebarEl = document.querySelector('.sidebar');
  const btnSbOpen = document.getElementById('btn-sb-open');
  const btnSbClose = document.getElementById('btn-sb-close');
  function setSidebar(open) {
    const focusInside = sidebarEl.contains(document.activeElement);
    const fromOpener = document.activeElement === btnSbOpen;
    appEl.dataset.sidebar = open ? 'open' : 'closed';
    if (!open && focusInside) btnSbOpen.focus();
    if (open && fromOpener) {
      const row = sbPagesEl.querySelector('.sb-item.active');
      if (row) { row.focus({ preventScroll: true }); row.scrollIntoView({ block: 'nearest' }); } else btnSbClose.focus();
    }
  }
  btnSbClose.addEventListener('click', () => setSidebar(false));
  btnSbOpen.addEventListener('click', () => setSidebar(true));
  document.getElementById('sb-scrim').addEventListener('click', () => setSidebar(false));

  searchEl.addEventListener('input', () => {
    searchQuery = searchEl.value.trim();
    renderSidebar();
  });

  // ---- Sort by newest: drop the manual order ----
  sortNewestBtn.addEventListener('click', () => {
    if (drag || !confirm('Forget the manual page order and show the newest pages first?')) return;
    saveOrder([]);
    renderSidebar();
  });

  // ---- Drag to reorder ----
  // Press a page row and move the pointer: the row follows it vertically, the
  // rows it passes slide aside, and releasing saves the new order (PUT /order,
  // broadcast to every tab). Esc cancels. Mouse and pen only: on a touch
  // screen a swipe keeps scrolling the list. Off while a search filter is on.
  const DRAG_START_PX = 4;      // movement before a press turns into a drag
  const EDGE_PX = 32;           // auto-scroll zone at the list's top/bottom
  const EDGE_SPEED = 800;       // auto-scroll px per second at the very edge
  const SETTLE_MS = 150;        // = the .settling transition
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let pressBecameDrag = false;  // swallow the click that ends a drag

  sbPagesEl.addEventListener('pointerdown', ev => {
    pressBecameDrag = false;
    if (drag || ev.button !== 0 || ev.pointerType === 'touch' || searchQuery) return;
    const item = ev.target.closest('.sb-item');
    if (!item || ev.target.closest('.sb-item-x')) return;
    drag = { phase: 'pressed', item, pointerId: ev.pointerId, startY: ev.clientY, lastY: ev.clientY };
  });

  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId || drag.phase === 'settling') return;
    if (ev.buttons === 0) {   // released somewhere we never saw the pointerup
      if (drag.phase === 'dragging') endDrag(true); else drag = null;
      return;
    }
    drag.lastY = ev.clientY;
    if (drag.phase === 'pressed') {
      if (Math.abs(ev.clientY - drag.startY) < DRAG_START_PX) return;
      if (!drag.item.isConnected || sbPagesEl.querySelectorAll('.sb-item').length < 2) { drag = null; return; }
      beginDrag();
    }
    layoutDrag();
  });
  window.addEventListener('pointerup', ev => {
    if (drag && ev.pointerId === drag.pointerId) endDrag(true);
  });
  window.addEventListener('pointercancel', ev => {
    if (drag && ev.pointerId === drag.pointerId) endDrag(false);
  });
  // Swallow only the pointer click that ends a drag; keyboard-activated clicks
  // (detail 0) always go through.
  sbPagesEl.addEventListener('click', ev => {
    if (!pressBecameDrag || ev.detail === 0) return;
    pressBecameDrag = false;
    ev.stopPropagation();
    ev.preventDefault();
  }, true);

  function beginDrag() {
    const items = [...sbPagesEl.querySelectorAll('.sb-item')];
    const listTop = sbPagesEl.getBoundingClientRect().top;
    const scroll0 = sbPagesEl.scrollTop;
    // Row tops in list-content coordinates, so auto-scrolling doesn't skew them.
    const tops = items.map(el => el.getBoundingClientRect().top - listTop + scroll0);
    const from = items.indexOf(drag.item);
    Object.assign(drag, {
      phase: 'dragging', items, tops, from, to: from, scroll0, rowH: drag.item.offsetHeight, carry: 0,
      pitch: (tops[tops.length - 1] - tops[0]) / (items.length - 1),
    });
    pressBecameDrag = true;
    drag.item.setPointerCapture(drag.pointerId);
    drag.item.addEventListener('lostpointercapture', () => {
      if (drag && drag.phase === 'dragging') endDrag(false);
    }, { once: true });
    drag.item.classList.add('dragging');
    sbPagesEl.classList.add('sorting');
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function layoutDrag() {
    const { items, tops, from, pitch } = drag;
    const view = sbPagesEl.scrollTop;
    const offset = drag.lastY - drag.startY + view - drag.scroll0;
    // Clamp to the first/last slot and to the visible part of the list, so the
    // row never leaves the list or hides under its edge while auto-scrolling.
    const lo = Math.max(tops[0], view) - tops[from];
    const hi = Math.min(tops[tops.length - 1], view + sbPagesEl.clientHeight - drag.rowH) - tops[from];
    const dy = Math.min(hi, Math.max(lo, offset));
    drag.item.style.transform = `translateY(${dy}px)`;
    const to = Math.round(from + dy / pitch);
    if (to === drag.to) return;
    drag.to = to;
    items.forEach((el, i) => {
      if (i === from) return;
      const shift = from < i && i <= to ? -pitch : to <= i && i < from ? pitch : 0;
      el.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }

  function autoScroll(now) {
    if (!drag || drag.phase !== 'dragging') return;
    // px per second, not per frame, so a 144 Hz screen doesn't scroll faster;
    // whole pixels per step, with the fraction carried to the next frame.
    const dt = drag.lastFrame ? Math.min(50, now - drag.lastFrame) / 1000 : 0;
    drag.lastFrame = now;
    const r = sbPagesEl.getBoundingClientRect();
    const depth = drag.lastY < r.top + EDGE_PX ? drag.lastY - (r.top + EDGE_PX)
      : drag.lastY > r.bottom - EDGE_PX ? drag.lastY - (r.bottom - EDGE_PX) : 0;
    const before = sbPagesEl.scrollTop;
    if (depth) {
      drag.carry += Math.max(-1, Math.min(1, depth / EDGE_PX)) * EDGE_SPEED * dt;
      const step = Math.trunc(drag.carry);
      drag.carry -= step;
      sbPagesEl.scrollTop += step;
    } else {
      drag.carry = 0;
    }
    const scrolled = sbPagesEl.scrollTop !== before;
    // While the list scrolls under the row, rows snap aside instead of
    // animating, so the open gap keeps up with the drop slot.
    sbPagesEl.classList.toggle('autoscrolling', scrolled);
    if (scrolled) layoutDrag();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(commit) {
    const d = drag;
    if (d.phase === 'settling') return;
    if (d.phase === 'pressed') { drag = null; return; }   // a plain click: let it through
    cancelAnimationFrame(d.raf);
    sbPagesEl.classList.remove('autoscrolling');
    d.phase = 'settling';
    const moved = commit && d.to !== d.from;
    if (!moved) d.items.forEach(el => { el.style.transform = ''; });
    d.item.classList.add('settling');
    d.item.style.transform = moved ? `translateY(${(d.to - d.from) * d.pitch}px)` : '';
    setTimeout(() => finishDrag(d, moved), reducedMotion.matches ? 0 : SETTLE_MS);
  }

  function finishDrag(d, moved) {
    drag = null;
    sbPagesEl.classList.remove('sorting');
    if (moved) {
      const ids = d.items.map(el => el.dataset.id);
      ids.splice(d.to, 0, ids.splice(d.from, 1)[0]);
      // Pages deleted mid-drag drop out; pages that arrived mid-drag aren't in
      // the list, so they stay on top as new arrivals.
      saveOrder(ids.filter(id => store.has(id)).map(id => store.get(id).filename));
    }
    renderSidebar();   // also catches up on renders skipped during the drag
  }

  // ---- Keyboard ----
  // Rows are focusable: Tab or ↑ ↓ move between them, Enter or Space opens
  // one, Delete moves it to the Trash (the ✕ button itself is mouse-only).
  sbPagesEl.addEventListener('keydown', ev => {
    const item = ev.target.closest('.sb-item');
    if (!item || ev.target !== item || ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      item.click();
    } else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      (ev.key === 'ArrowDown' ? item.nextElementSibling : item.previousElementSibling)?.focus();
    } else if (ev.key === 'Delete') {
      ev.preventDefault();
      item.querySelector('.sb-item-x').click();
    }
  });

  // Alt+Up / Alt+Down moves the focused row (with no row focused: the open
  // page) one slot; the row keeps the focus.
  function movePage(delta) {
    if (drag || searchQuery || modalBackdrop.dataset.open === 'true') return false;
    const id = document.activeElement?.closest?.('#sb-pages .sb-item')?.dataset.id || activeId;
    if (!id) return false;
    const ids = sortedMessages().map(m => m.id);
    const from = ids.indexOf(id), to = from + delta;
    if (from < 0 || to < 0 || to >= ids.length) return false;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    saveOrder(ids.map(i => store.get(i).filename));
    renderSidebar();
    sbPagesEl.querySelector(`.sb-item[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest' });
    return true;
  }

  // ---- Theme toggle ----
  const btnTheme = document.getElementById('btn-theme');
  const themeIc = document.getElementById('theme-ic');
  const themeLabel = document.getElementById('theme-label');
  const ICON_SUN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.93 4.93 2.12 2.12"/><path d="m16.95 16.95 2.12 2.12"/><path d="m4.93 19.07 2.12-2.12"/><path d="m16.95 7.05 2.12-2.12"/></svg>';
  const ICON_MOON = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
  function syncThemeButton() {
    const dark = currentTheme() === 'dark';
    themeIc.innerHTML = dark ? ICON_SUN : ICON_MOON;
    themeLabel.textContent = dark ? 'Light mode' : 'Dark mode';
  }
  btnTheme.addEventListener('click', () => {
    document.documentElement.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, currentTheme()); } catch (e) { /* ignore */ }
    syncThemeButton();
    initMermaidForTheme(currentTheme());
    rerenderAllMermaid();
  });
  syncThemeButton();

  // ---- ••• menu ----
  function closeMenu() { menuEl.dataset.open = 'false'; }
  btnMenu.addEventListener('click', ev => {
    ev.stopPropagation();
    if (menuEl.dataset.open === 'true') { closeMenu(); return; }
    const r = btnMenu.getBoundingClientRect();
    menuEl.style.top = `${r.bottom + 4}px`;
    menuEl.style.right = `${Math.max(8, window.innerWidth - r.right)}px`;
    menuEl.style.left = 'auto';
    menuEl.dataset.open = 'true';
  });
  document.addEventListener('click', ev => {
    if (menuEl.dataset.open === 'true' && !menuEl.contains(ev.target)) closeMenu();
  });

  document.getElementById('menu-delete').addEventListener('click', async () => {
    closeMenu();
    const msg = store.get(activeId);
    if (!msg) return;
    try {
      const res = await fetch(`/messages/${encodeURIComponent(msg.filename)}`, { method: 'DELETE' });
      // 404: another tab already moved it to the trash
      if (!res.ok && res.status !== 404) throw new Error(`HTTP ${res.status}`);
      removeMessage(msg);
    } catch (e) {
      alert('Delete failed: ' + e.message);
    }
  });

  // ---- Clear all ----
  document.getElementById('btn-clear').addEventListener('click', async () => {
    if (!confirm('Move all pages to Trash?')) return;
    try {
      await fetch('/clear', { method: 'POST' });
      store.clear();
      activeId = null;
      renderEmptyPage();
      renderSidebar();
    } catch (e) {
      alert('Clear failed: ' + e.message);
    }
  });

  // ---- Trash modal ----
  function openTrash() {
    modalBackdrop.dataset.open = 'true';
    modalBody.innerHTML = '<div class="trash-empty">loading...</div>';
    fetch('/trash').then(r => r.json()).then(list => {
      list.sort((a, b) => b.mtime - a.mtime);
      renderTrashList(list);
    }).catch(e => {
      modalBody.innerHTML = `<div class="trash-empty">load failed: ${escapeHtml(e.message)}</div>`;
    });
  }
  function closeTrash() { modalBackdrop.dataset.open = 'false'; }

  function renderTrashList(list) {
    if (!list.length) {
      modalBody.innerHTML = '<div class="trash-empty">Trash is empty</div>';
      return;
    }
    modalBody.innerHTML = '';
    list.forEach(msg => modalBody.appendChild(buildTrashItem(msg)));
  }

  function buildTrashItem(msg) {
    const item = document.createElement('div');
    item.className = 'trash-item';
    item.dataset.expanded = 'false';

    const meta = pageMeta(msg);
    const purge = msg.purge_at ? formatPurgeIn(msg.purge_at) : '';

    const row = document.createElement('div');
    row.className = 'trash-row';
    row.innerHTML = `
      <span class="trash-title" title="${escapeHtml(msg.filename)}">
        <span>${escapeHtml(meta.icon)}</span><span>${escapeHtml(meta.title)}</span>
      </span>
      <span class="trash-meta">
        <span>deleted ${escapeHtml(formatTime(msg.mtime))}</span>
        ${purge ? `<span class="purge">${escapeHtml(purge)}</span>` : ''}
      </span>
      <button class="trash-restore" type="button">Restore</button>
    `;

    row.querySelector('.trash-title').addEventListener('click', () => {
      item.dataset.expanded = item.dataset.expanded === 'true' ? 'false' : 'true';
      const pv = item.querySelector('.trash-preview');
      if (item.dataset.expanded === 'true' && !pv.dataset.rendered) {
        pv.innerHTML = renderMarkdown(msg.content || '');
        pv.dataset.rendered = 'true';
      }
    });

    const restoreBtn = row.querySelector('.trash-restore');
    restoreBtn.addEventListener('click', async () => {
      restoreBtn.disabled = true;
      restoreBtn.textContent = 'Restoring...';
      try {
        const res = await fetch(`/trash/restore/${encodeURIComponent(msg.filename)}`, { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        item.remove();
        if (!modalBody.querySelector('.trash-item')) {
          modalBody.innerHTML = '<div class="trash-empty">Trash is empty</div>';
        }
      } catch (e) {
        restoreBtn.disabled = false;
        restoreBtn.textContent = 'Restore';
        alert('Restore failed: ' + e.message);
      }
    });

    item.appendChild(row);

    const preview = document.createElement('div');
    preview.className = 'trash-preview';
    item.appendChild(preview);

    return item;
  }

  document.getElementById('btn-trash').addEventListener('click', openTrash);
  document.getElementById('modal-close').addEventListener('click', closeTrash);
  modalBackdrop.addEventListener('click', ev => {
    if (ev.target === modalBackdrop) closeTrash();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (drag && drag.phase === 'dragging') endDrag(false);
      else if (modalBackdrop.dataset.open === 'true') closeTrash();
      else if (narrowMq.matches && appEl.dataset.sidebar === 'open') setSidebar(false);
      closeMenu();
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && !ev.shiftKey && !typing
        && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')
        && movePage(ev.key === 'ArrowUp' ? -1 : 1)) {
      ev.preventDefault();
    }
  });

  connectSSE();
</script>
</body>
</html>
